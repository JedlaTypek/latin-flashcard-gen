services:
  flashcard-gen:
    build: .
    container_name: flashcard-gen
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      # Volume je připojen výhradně na /app/data — kód aplikace se vždy aktualizuje z image
      - flashcard_data:/app/data

volumes:
  flashcards_data:
    name: flashcards_data

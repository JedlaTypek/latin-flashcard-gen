version: "3.8"

services:
  latin-flashcard-gen:
    build: .
    container_name: latin-flashcard-gen
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
    volumes:
      # Použití pojmenovaného svazku namísto relativní cesty
      - latin_flashcards_data:/app/data

# Definice pojmenovaného svazku
volumes:
  latin_flashcards_data:
    name: latin_flashcards_data
